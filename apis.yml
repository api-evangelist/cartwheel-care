name: Cartwheel Care
description: 'Cartwheel (Cartwheel Care) is a school-based youth mental health provider
  that partners with K-12 school districts to deliver rapid-access, evidence-based
  therapy and psychiatric care to students. Through licensed clinicians it offers individual
  and group therapy, medication management, and parent guidance, with Care Coordinators
  contacting families within 24 hours of a school referral and initial appointments
  typically available within 7-10 days; a course of care generally lasts two to six
  months. The company is backed by General Catalyst and operates across 25+ school
  districts in multiple states. Cartwheel publishes no public API or developer surface;
  its software footprint is a school- and family-facing web application at app.cartwheel.org,
  hosted on the HIPAA-compliant Aptible platform.'
